    <script>
        var wow = new WOW(
            {

                mobile: true,
                live: true,
                callback: function (box) {
                },
                scrollContainer: null
            }
        );
        wow.init();
    </script>

    <script>
        (function () {
            var bgMusic = document.getElementById('bgMusic');
            var musicToggle = document.getElementById('musicToggle');
            bgMusic.volume = 0.5;

            function updateToggleIcon() {
                musicToggle.classList.toggle('is-playing', !bgMusic.paused);
            }

            function tryPlay() {
                var playPromise = bgMusic.play();
                if (playPromise !== undefined) {
                    playPromise.then(updateToggleIcon).catch(function () {
                        // 瀏覽器擋下自動播放，等待使用者互動後再播放
                    });
                }
            }

            function playOnFirstInteraction() {
                tryPlay();
                document.removeEventListener('click', playOnFirstInteraction);
                document.removeEventListener('touchstart', playOnFirstInteraction);
                document.removeEventListener('scroll', playOnFirstInteraction);
            }

            document.addEventListener('click', playOnFirstInteraction, { once: true });
            document.addEventListener('touchstart', playOnFirstInteraction, { once: true });
            document.addEventListener('scroll', playOnFirstInteraction, { once: true });

            musicToggle.addEventListener('click', function (e) {
                e.stopPropagation();
                if (bgMusic.paused) {
                    tryPlay();
                } else {
                    bgMusic.pause();
                }
                updateToggleIcon();
            });

            bgMusic.addEventListener('play', updateToggleIcon);
            bgMusic.addEventListener('pause', updateToggleIcon);

            tryPlay();
        })();
    </script>

    <script>
        (function () {
            var parallaxEls = document.querySelectorAll('.parallax-img');
            if (!parallaxEls.length) return;

            var ticking = false;

            function updateParallax() {
                var viewportHeight = window.innerHeight;

                parallaxEls.forEach(function (el) {
                    var wrap = el.parentElement;
                    var rect = wrap.getBoundingClientRect();

                    if (rect.bottom < 0 || rect.top > viewportHeight) return;

                    var center = rect.top + rect.height / 2 - viewportHeight / 2;
                    var maxOffset = rect.height * 0.15;
                    var offset = Math.max(-maxOffset, Math.min(maxOffset, center * 0.4));

                    el.style.transform = 'translateY(calc(-50% - ' + offset + 'px))';
                });

                ticking = false;
            }

            function onScroll() {
                if (!ticking) {
                    window.requestAnimationFrame(updateParallax);
                    ticking = true;
                }
            }

            window.addEventListener('scroll', onScroll, { passive: true });
            window.addEventListener('resize', onScroll);
            updateParallax();
        })();
    </script>
